<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Resolve the theme before first paint so the page doesn't flash the
      // wrong palette. An explicit stored choice ('light' = Caribbean, 'mid' =
      // Titanium, 'dark' = Chalk Dark, 'arcade' = Block Arcade) wins; anything
      // else (no choice yet, or a retired 'neon'/'sky') gets Block Arcade, the
      // default the analyzer uses too. The key is shared with the analyzer.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('element08.theme');
        } catch (e) {
          /* localStorage blocked */
        }
        if (t === 'dark') return;
        var known = t === 'light' || t === 'mid' || t === 'arcade';
        document.documentElement.classList.add(known ? t : 'arcade');
      })();
    </script>
    <meta
      name="description"
      content="ELEMENT | 08 Coach: build freediving training plans and hand them to your athletes as a file. No account needed."
    />
    <title>ELEMENT | 08 Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
